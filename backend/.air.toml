# .air.toml
root = "."
tmp_dir = "tmp"

[build]
# Build command – tell Air where your main.go is
cmd = "go build -o ./tmp/main ./cmd/server"

# Binary to run after build
bin = "tmp/main"

# Optional: run binary with env vars (e.g., load .env)
full_bin = "./tmp/main"

# File extensions to watch
include_ext = ["go", "tpl", "tmpl", "html"]

# Directories to ignore
exclude_dir = ["tmp", "vendor"]

[log]
time = true
